name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (nombres indefinidos, imports y variables sin uso)
        run: ruff check .
      - name: Pruebas (las que necesitan la base real se omiten sin DATABASE_URL)
        run: pytest -q
        env:
          FLASK_SECRET_KEY: ci
