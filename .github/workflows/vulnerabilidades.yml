name: Vulnerabilidades

# Busca avisos de seguridad conocidos en las dependencias de producción. Corre una vez por semana (los avisos aparecen aunque nadie
# toque el código) y cada vez que cambia requirements.txt. Si falla, la lista de paquetes afectados está en el log del paso.
on:
  schedule:
    - cron: "0 12 * * 1"
  push:
    paths: ["requirements.txt", ".github/workflows/vulnerabilidades.yml"]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --progress-spinner off
