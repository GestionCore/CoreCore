# Proxy inverso de nginx para CoreLux. `certbot --nginx` reescribe este
# archivo solo para agregar el bloque de SSL — no lo edites a mano
# después de correr certbot, o el próximo renew se lo puede pisar.
#
# TU-DOMINIO.com lo reemplaza deploy/setup_server.sh automaticamente.

server {
    listen 80;
    server_name TU-DOMINIO.com www.TU-DOMINIO.com;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/corelux/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
