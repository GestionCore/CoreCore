# fly.toml app configuration file generated for corecore on 2026-09-28T20:00:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'corecore'
primary_region = 'gru'

[build]

[env]
  FLASK_DEBUG = 'false'
  PORT = '8080'
  # Conexiones por proceso: 2 máquinas x 2 workers x 3 = 12 de las 15 que admite el pooler de Supabase (ver db.py)
  DB_POOL_MAX = '3'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/planes'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
