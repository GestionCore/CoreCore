{% extends "base.html" %}
{% block title %}Preguntas · CoreLux{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title"><svg class="icon page-title-icono" aria-hidden="true"><use href="#icon-chat"/></svg>Preguntas</h1>
        <div class="page-subtitle">Respondé desde acá — <strong>se publica directo en Mercado Libre</strong>. Una pregunta rápida es una venta más cerca.</div>
    </div>
    <button type="button" class="btn btn-secondary" id="btn-actualizar">
        <svg class="icon" style="width:14px;height:14px;" id="btn-refresh-icon"><use href="#icon-refresh"/></svg> Actualizar
    </button>
</div>

<!-- Mensajes de compradores sin leer (si los hay): se contestan en Mercado Libre -->
<div id="aviso-mensajes"></div>

<!-- Cuánto tardás en responder: pesa en la conversión y en la reputación -->
<div id="tiempo-respuesta"></div>

<!-- Estado de la bandeja, en una frase -->
<div id="estado-preguntas"></div>

<div class="ux-periodo" style="margin-bottom:18px;">
    <div class="ux-periodo-botones" style="flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary filtro-btn active" data-estado="pendiente">Pendientes</button>
        <button type="button" class="btn btn-secondary filtro-btn" data-estado="respondida">Respondidas</button>
        <button type="button" class="btn btn-secondary filtro-btn" data-estado="ignorada">Ignoradas</button>
        <button type="button" class="btn btn-secondary filtro-btn" data-estado="todos">Todas</button>
    </div>
    <span id="conteo-label" class="text-muted" style="font-size:0.85em; margin-left:auto;"></span>
</div>

<div id="lista-preguntas">
    <div class="skeleton" style="height:150px; width:100%; border-radius:14px; margin-bottom:12px;"></div>
    <div class="skeleton" style="height:150px; width:100%; border-radius:14px;"></div>
</div>

<script>
let _estado = 'pendiente';
let _preguntas = [];

const $ = id => document.getElementById(id);

async function cargarMensajes() {
    try {
        const d = await (await fetch('/api/mensajes/sin_leer')).json();
        if (!d.total) { $('aviso-mensajes').innerHTML = ''; return; }
        const links = (d.conversaciones || []).map(c => `<a class="btn btn-secondary" style="padding:5px 12px; font-size:0.85em;" href="${UX.esc(c.link)}" target="_blank" rel="noopener">Orden #${UX.esc(c.id)}${c.cantidad > 1 ? ` · ${c.cantidad}` : ''} ↗</a>`).join(' ');
        $('aviso-mensajes').innerHTML = `<div class="ux-banner ux-accion" role="status">
            <div class="ux-banner-icono">${UX.icono('chat')}</div>
            <div class="ux-banner-cuerpo">
                <div class="ux-banner-titulo"><b>${d.total} mensaje${d.total > 1 ? 's' : ''} de compradores sin leer</b></div>
                <div class="ux-banner-detalle">Se responden desde Mercado Libre: tocá la orden para abrir la conversación.</div>
                ${links ? `<div class="flex-gap" style="margin-top:10px; flex-wrap:wrap; gap:8px;">${links}</div>` : ''}
            </div></div>`;
    } catch (e) { /* sin aviso: las preguntas siguen funcionando */ }
}

function textoMinutos(min) {
    if (min < 1) return 'menos de 1 min';
    if (min < 60) return min + ' min';
    const h = min / 60;
    return h < 24 ? (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h' : Math.round(h / 24) + ' días';
}

async function cargarTiempoRespuesta() {
    try {
        const d = await (await fetch('/api/preguntas/tiempo_respuesta')).json();
        if (!d || !d.muestra) return;
        const sub = d.tono === 'ok' ? 'Respondés rápido: eso ayuda a vender.' : (d.tono === 'warn' ? 'Respondé más rápido: el comprador suele decidir en la misma conversación.' : 'Tardás demasiado: muchas ventas se pierden por esto.');
        $('tiempo-respuesta').innerHTML = UX.banner({
            tono: d.tono, icono: 'bolt',
            tituloHtml: `Respondés en <b>${UX.esc(textoMinutos(d.mediana_min))}</b> <span class="text-muted" style="font-weight:600;">(típico, sobre tus últimas ${d.muestra} respuestas)</span>`,
            detalle: `${d.pct_en_1h}% de tus respuestas salió en la primera hora. ${sub}`,
        });
    } catch (e) { /* sin dato: no se muestra nada */ }
}

document.addEventListener('DOMContentLoaded', () => {
    cargarTiempoRespuesta();
    cargarMensajes();
    cargarPreguntas();
    $('btn-actualizar').addEventListener('click', cargarPreguntas);
    document.querySelectorAll('.filtro-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        _estado = btn.dataset.estado;
        cargarPreguntas();
    }));
    // Un solo listener para todas las tarjetas (las tarjetas se re-crean al cargar)
    $('lista-preguntas').addEventListener('click', alClickEnTarjeta);
});

// "hace 3 h" / "hace 2 días" y qué tan urgente es (más de 24 h sin responder = rojo)
function antiguedad(iso) {
    if (!iso) return { texto: '', horas: 0, tono: 'info' };
    const horas = Math.max(0, (Date.now() - new Date(iso).getTime()) / 3600000);
    let texto;
    if (horas < 1) texto = 'hace ' + Math.max(1, Math.round(horas * 60)) + ' min';
    else if (horas < 24) texto = 'hace ' + Math.round(horas) + ' h';
    else texto = 'hace ' + Math.round(horas / 24) + (Math.round(horas / 24) === 1 ? ' día' : ' días');
    return { texto, horas, tono: horas >= 24 ? 'danger' : (horas >= 4 ? 'warn' : 'info') };
}

async function cargarPreguntas() {
    const icon = $('btn-refresh-icon');
    icon.classList.add('spin-anim');
    try {
        const resp = await fetch(`/api/preguntas/lista?estado=${encodeURIComponent(_estado)}`);
        _preguntas = await resp.json();
        renderLista();
    } catch (e) {
        mostrarToast('No se pudieron cargar las preguntas — revisá la conexión', 'error');
    } finally {
        icon.classList.remove('spin-anim');
    }
}

function renderEstado() {
    const cont = $('estado-preguntas');
    if (_estado !== 'pendiente') { cont.innerHTML = ''; return; }
    const n = _preguntas.length;
    if (n === 0) {
        cont.innerHTML = UX.banner({ tono: 'ok', icono: 'check', tituloHtml: '<b>Estás al día.</b> No tenés preguntas pendientes', detalle: 'Cuando entre una nueva, la ves acá arriba de todo.' });
        return;
    }
    const masVieja = antiguedad(_preguntas[0].creado_en_iso);
    cont.innerHTML = UX.banner({
        tono: masVieja.tono === 'info' ? 'accion' : masVieja.tono, icono: 'chat',
        tituloHtml: `<b>${n} pregunta${n > 1 ? 's' : ''} esperando tu respuesta</b>${masVieja.texto ? ` — la más vieja llegó <b>${UX.esc(masVieja.texto)}</b>` : ''}`,
        detalle: masVieja.horas >= 24 ? 'Hay preguntas con más de un día: cada hora cuenta para no perder la venta.' : 'Respondé ahora: los compradores suelen comprar en la misma conversación.',
    });
}

function renderLista() {
    const cont = $('lista-preguntas');
    $('conteo-label').textContent = `${_preguntas.length} ${_preguntas.length === 1 ? 'pregunta' : 'preguntas'}`;
    renderEstado();
    if (!_preguntas.length) {
        cont.innerHTML = _estado === 'pendiente' ? '' : `<div class="ux-vacio"><div class="ux-vacio-icono">${UX.icono('chat')}</div><div class="ux-vacio-titulo">No hay preguntas en esta vista</div></div>`;
        return;
    }
    cont.innerHTML = _preguntas.map(tarjeta).join('');
}

function tarjeta(p) {
    const a = antiguedad(p.creado_en_iso);
    const pendiente = p.estado === 'pendiente';
    const pillEstado = pendiente ? `<span class="ux-pill ux-${a.tono}">${UX.esc(a.texto || 'Pendiente')}</span>`
        : (p.estado === 'respondida' ? '<span class="ux-pill ux-ok">Respondida</span>' : '<span class="ux-pill ux-neutral ux-pill-suave">Ignorada</span>');
    const verPub = p.item_id ? `<a class="ux-pregunta-item" href="/stock?drawer=${encodeURIComponent(p.item_id)}" title="Ver la publicación">${UX.esc(p.titulo_item)} ↗</a>` : `<span class="ux-pregunta-item">${UX.esc(p.titulo_item)}</span>`;
    const acciones = pendiente ? `
        <textarea rows="3" placeholder="Escribí tu respuesta…" aria-label="Tu respuesta">${UX.esc(p.respuesta_sugerida)}</textarea>
        <div class="flex-gap" style="margin-top:10px;">
            <button type="button" class="btn btn-primary btn-lg" data-accion="publicar">${UX.icono('check')}Publicar respuesta</button>
            <button type="button" class="btn btn-secondary" data-accion="sugerir">${UX.icono('bolt')}Sugerir con IA</button>
            <button type="button" class="btn btn-secondary" data-accion="ignorar" style="margin-left:auto;">Ignorar</button>
        </div>` : (p.respuesta_sugerida ? `<div class="text-muted" style="font-size:0.85em; margin-top:8px;"><b>Respuesta:</b> ${UX.esc(p.respuesta_sugerida)}</div>` : '');
    return `<div class="ux-pregunta ux-${pendiente ? a.tono : 'neutral'}" data-qid="${UX.esc(p.question_id)}">
        <div class="ux-pregunta-cabecera"><div class="ux-titulo-thumb" style="min-width:0;">${p.thumbnail ? `<img src="${UX.esc(p.thumbnail)}" class="thumb-sm" alt="" loading="lazy">` : ''}${verPub}</div>${pillEstado}</div>
        <div class="ux-pregunta-texto">“${UX.esc(p.texto)}”</div>
        <div class="text-muted" style="font-size:0.82em; margin-bottom:10px;">${UX.esc(p.fecha)}</div>
        ${acciones}
    </div>`;
}

function alClickEnTarjeta(ev) {
    const boton = ev.target.closest('[data-accion]');
    if (!boton) return;
    const card = boton.closest('.ux-pregunta');
    const qid = card.dataset.qid;
    ({ publicar: publicarRespuesta, sugerir: sugerirIA, ignorar: ignorarPregunta })[boton.dataset.accion](qid, card, boton);
}

async function publicarRespuesta(qid, card, boton) {
    const ta = card.querySelector('textarea');
    const texto = (ta.value || '').trim();
    if (!texto) { mostrarToast('Escribí una respuesta antes de publicar', 'error'); ta.focus(); return; }
    const original = boton.innerHTML;
    boton.disabled = true;
    boton.innerHTML = `${UX.icono('refresh', '').replace('class="icon"', 'class="icon spin-anim"')}Publicando…`;
    try {
        const d = await (await fetch('/api/preguntas/responder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question_id: qid, texto }) })).json();
        if (d.ok) {
            mostrarToast('✓ Respuesta publicada en Mercado Libre', 'success');
            sacarTarjeta(qid, card);
        } else {
            mostrarToast(d.detalle || 'No se pudo publicar la respuesta', 'error');
            boton.disabled = false; boton.innerHTML = original;
        }
    } catch (e) {
        mostrarToast('Error de red — probá de nuevo', 'error');
        boton.disabled = false; boton.innerHTML = original;
    }
}

async function sugerirIA(qid, card, boton) {
    const pregunta = _preguntas.find(p => p.question_id === qid);
    if (!pregunta) return;
    const ta = card.querySelector('textarea');
    const original = boton.innerHTML;
    boton.disabled = true;
    boton.innerHTML = `${UX.icono('refresh').replace('class="icon"', 'class="icon spin-anim"')}Pensando…`;
    try {
        const d = await (await fetch('/api/preguntas/sugerir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto: pregunta.texto, titulo_item: pregunta.titulo_item }) })).json();
        if (d.ok) { ta.value = d.respuesta; ta.focus(); mostrarToast('Respuesta sugerida — leela y ajustala antes de publicar', 'info'); }
        else mostrarToast(d.error || 'No se pudo generar la sugerencia', 'error');
    } catch (e) {
        mostrarToast('Error de red — probá de nuevo', 'error');
    } finally {
        boton.disabled = false; boton.innerHTML = original;
    }
}

async function ignorarPregunta(qid, card) {
    try {
        const d = await (await fetch('/api/preguntas/ignorar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question_ids: [qid] }) })).json();
        if (d.ok) { mostrarToast('Pregunta ignorada', 'info'); sacarTarjeta(qid, card); }
        else mostrarToast(d.detalle || 'No se pudo ignorar la pregunta', 'error');
    } catch (e) { mostrarToast('Error de red — probá de nuevo', 'error'); }
}

// La tarjeta resuelta sale con una animación corta y la bandeja se recalcula sin volver a pedir todo
function sacarTarjeta(qid, card) {
    _preguntas = _preguntas.filter(p => p.question_id !== qid);
    card.classList.add('ux-pregunta-sale');
    setTimeout(() => { card.remove(); renderEstado(); $('conteo-label').textContent = `${_preguntas.length} ${_preguntas.length === 1 ? 'pregunta' : 'preguntas'}`; }, 280);
}
</script>
{% endblock %}
