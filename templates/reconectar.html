<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconectá tu cuenta · CoreLux</title>
    <link rel="stylesheet" href="/static/css/fonts.css?v={{ static_v('css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_v('css/style.css') }}">
    <style>
        html, body { height: 100%; margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }
        body { display: flex; align-items: center; justify-content: center; }
        .estado-wrap { max-width: 460px; width: 100%; margin: 24px; }
        .estado-card {
            padding: 44px 40px 36px; border-radius: var(--radius-lg, var(--radius-md));
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--shadow-elevated); text-align: center;
            animation: fadeInUp 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        .estado-icono {
            width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--semantic-warning-bg); color: var(--semantic-warning);
            box-shadow: 0 0 26px -6px rgba(240, 161, 59, 0.45);
        }
        .estado-titulo { font-family: var(--font-display); font-size: 1.4em; font-weight: 700; margin-bottom: 10px; }
        .estado-subtitulo { color: var(--text-secondary); font-size: 0.92em; line-height: 1.6; margin-bottom: 30px; }
    </style>
</head>
<body>
<div class="estado-wrap">
    <div class="estado-card">
        <div class="estado-icono">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.86-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </div>
        <div class="estado-titulo">Tu cuenta se desconectó</div>
        <div class="estado-subtitulo">Puede pasar si revocaste el acceso, cambiaste tu clave, o pasó mucho tiempo sin usarlo. Solo hace falta volver a autorizar.</div>
        <a href="{{ url_for('conectar') }}" class="btn btn-primary btn-block">Reconectar cuenta</a>
    </div>
</div>
</body>
</html>
