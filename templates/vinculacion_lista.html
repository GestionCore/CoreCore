<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta vinculada · CoreLux</title>
    <link rel="stylesheet" href="/static/css/fonts.css?v={{ static_v('css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_v('css/style.css') }}">
    <style>
        html, body { height: 100%; margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }
        body { display: flex; align-items: center; justify-content: center; }
        .estado-wrap { max-width: 460px; width: 100%; margin: 24px; }
        .estado-card { padding: 40px 36px 32px; border-radius: var(--radius-lg, var(--radius-md)); background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--shadow-elevated); text-align: center; }
        .estado-icono { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); }
        .estado-titulo { font-family: var(--font-display); font-size: 1.4em; font-weight: 700; margin-bottom: 12px; }
        .estado-subtitulo { color: var(--text-secondary); font-size: 0.92em; line-height: 1.6; margin-bottom: 26px; }
    </style>
</head>
<body>
<div class="estado-wrap">
    <div class="estado-card">
        <div class="estado-icono">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="estado-titulo">{{ 'Listo' if tipo == 'success' else 'Ya estaba conectada' }}</div>
        <div class="estado-subtitulo">
            {{ mensaje }}
            {% if tipo == 'success' %}<br><br>Volvé a CoreLux en tu navegador de siempre y recargá la página: la nueva cuenta aparece en el selector de cuentas del menú.{% endif %}
        </div>
        <a href="{{ url_for('landing') }}" class="btn btn-primary btn-block">Ir a CoreLux</a>
    </div>
</div>
</body>
</html>
